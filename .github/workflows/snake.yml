name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"     # هر روز 00:00 UTC اجرا می‌شود
  workflow_dispatch:         # اجرا دستی

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # گیت ریپو را چک‌اوت کن
      - name: Checkout repository
        uses: actions/checkout@v4

      # ساخت snake جدید
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Sinusab
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # ایجاد برنچ output اگر وجود نداشت
      - name: Create output branch if missing
        run: |
          git fetch
          if ! git rev-parse --verify origin/output; then
            git checkout --orphan output
            git rm -rf .
            git commit --allow-empty -m "Initialize output branch"
            git push origin output
          fi

      # چک‌اوت برنچ output
      - name: Checkout output branch
        run: |
          git checkout output

      # کپی خروجی به output
      - name: Copy snake to output branch
        run: |
          cp -f dist/github-contribution-grid-snake.svg .
          cp -f dist/github-contribution-grid-snake-dark.svg .

      # کامیت و پوش خودکار
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "github-actions@github.com"
          git add .
          git commit -m "Updated snake animation" || echo "No changes to commit"
          git push origin output
